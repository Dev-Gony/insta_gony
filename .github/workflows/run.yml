name: Blog to SNS

# 네이버 블로그(NAVER_BLOG_ID)에 새 글이 올라오면 카드뉴스로 만들어 켜 둔 채널(CHANNELS, 기본 instagram)에 올린다.
# 실행마다 아직 안 올린 새 글 1개만. 새 글이 없으면 무거운 설치 없이 바로 끝난다.

on:
  workflow_dispatch:
    inputs:
      link:
        description: "이 블로그 글로 만들기 (비우면 RSS에서 새 글 자동 선택)"
        required: false
      upload:
        description: "채널에 올리기 (끄면 카드만 만들어 아티팩트로 남김)"
        type: boolean
        default: false
      check_account:
        description: "인스타 토큰 확인만 하기 (계정 정보만 읽고 끝, 게시 안 함)"
        type: boolean
        default: false

  schedule:
    # 08~22시, 2시간마다. 정각을 피해 :23분.
    - cron: "23 8-22/2 * * *"
      timezone: "Asia/Seoul"

permissions:
  contents: write

concurrency:
  group: blog-sns
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      NAVER_BLOG_ID: ${{ vars.NAVER_BLOG_ID }}
      INSTA_HANDLE: ${{ vars.INSTA_HANDLE }}
      INSTA_MASTHEAD: ${{ vars.INSTA_MASTHEAD }}
      MAX_AGE_DAYS: ${{ vars.MAX_AGE_DAYS }}
      SKIP_CATEGORIES: ${{ vars.SKIP_CATEGORIES }}
      DAILY_LIMIT: ${{ vars.DAILY_LIMIT }}
      CHANNELS: ${{ vars.CHANNELS }}
      CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
      INSTAGRAM_GRAPH_HOST: ${{ vars.INSTAGRAM_GRAPH_HOST }}
      INPUT_LINK: ${{ github.event.inputs.link }}

    steps:
      - name: Download repository
        uses: actions/checkout@v7

      - name: Use the latest history
        run: |
          git fetch --depth=1 origin main
          git checkout origin/main -- config/history.json || echo "No history on main yet."

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Instagram account only
        if: github.event.inputs.check_account == 'true'
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
        run: python main.py --check-account

      - name: Check for a new blog post
        id: check
        if: github.event.inputs.check_account != 'true'
        run: |
          if [ -n "$INPUT_LINK" ]; then
            echo "has_post=true" >> "$GITHUB_OUTPUT"
          else
            python main.py --check
          fi

      - name: Set up Node.js
        if: steps.check.outputs.has_post == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: video/package-lock.json

      - name: Install card renderer (Remotion)
        if: steps.check.outputs.has_post == 'true'
        working-directory: video
        run: |
          npm ci
          npx remotion browser ensure

      - name: Install Claude Code
        if: steps.check.outputs.has_post == 'true'
        run: npm install -g @anthropic-ai/claude-code

      - name: Make cards and post
        if: steps.check.outputs.has_post == 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          # 예약 실행은 올리고, 수동 실행은 upload를 켰을 때만 올린다.
          INPUT_UPLOAD: ${{ github.event_name == 'schedule' || github.event.inputs.upload == 'true' }}
        run: |
          args=()

          if [ -n "$INPUT_LINK" ]; then
            args+=(--link "$INPUT_LINK")
          fi

          if [ "$INPUT_UPLOAD" != "true" ]; then
            args+=(--no-upload)
          fi

          python main.py "${args[@]}"

      - name: Keep cards as artifact
        if: always() && steps.check.outputs.has_post == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: cards
          path: |
            runtime/posts/*/card-*.jpg
            runtime/posts/*/caption.txt
            runtime/posts/*/content.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Save history
        if: github.ref == 'refs/heads/main' && steps.check.outputs.has_post == 'true'
        run: |
          if [ ! -f config/history.json ]; then
            echo "No history to save."
            exit 0
          fi

          git config user.name "insta-gony-bot"
          git config user.email "insta-gony-bot@users.noreply.github.com"
          cp config/history.json /tmp/my_history.json

          # 그사이 다른 커밋이 main에 올라왔으면 기록을 (링크, 채널) 기준으로 합친다. 최대 3번 시도.
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main

            python - <<'PY'
          import json, os
          path = "config/history.json"
          latest = json.load(open(path, encoding="utf-8")) if os.path.exists(path) else []
          mine = json.load(open("/tmp/my_history.json", encoding="utf-8"))
          key = lambda entry: (entry.get("link"), entry.get("channel"))
          known = {key(entry) for entry in latest}
          merged = latest + [entry for entry in mine if key(entry) not in known]
          with open(path, "w", encoding="utf-8") as file:
              json.dump(merged, file, ensure_ascii=False, indent=2)
              file.write("\n")
          print(f"history: {len(latest)} -> {len(merged)}")
          PY

            git add config/history.json

            if git diff --cached --quiet; then
              echo "No history changes to save."
              exit 0
            fi

            git commit -m "Update history"

            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Push failed, retrying ($attempt)"
            sleep 5
          done

          exit 1
